name: jumpvalues
description: "A new Flutter project."
publish_to: 'none'
# version: 2.0.3+4
# 2.0.3 is version name and 4 is build number
version: 5.0.2+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  cached_network_image: ^3.3.1
  dio: ^5.4.2+1
  path_provider: ^2.1.5
  share_plus: ^10.1.3
  open_file_plus: ^3.4.1+1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.2
  flutter_mobx: ^2.0.6+5
  flutter_pannable_rating_bar: ^2.7.2+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  intl_phone_field: ^3.2.0
  mask_text_input_formatter: ^2.9.0
  mobx: ^2.2.0
  multi_select_flutter: ^4.1.3
  nb_utils: ^7.0.4
  permission_handler: ^10.4.0
  phone_numbers_parser: ^9.0.0
  socket_io_client: ^2.0.3+1
  syncfusion_flutter_calendar: ^26.1.38
  twilio_programmable_video: ^1.1.1
  uuid: ^4.4.2
  webview_flutter: ^4.9.0
  youtube_player_flutter: ^8.1.2
  flutter_webrtc: ^0.12.1+hotfix.1

dev_dependencies:
  build_runner: ^2.4.6

  hive_generator: ^2.0.1
  mobx_codegen: ^2.6.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/images/ic_launcher.png"
  adaptive_icon_foreground: "assets/images/ic_launcher.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
